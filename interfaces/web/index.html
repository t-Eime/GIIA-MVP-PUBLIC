<!doctype html>
<html>
<head><meta name="viewport" content="width=device-width,initial-scale=1">
<style>
body{font-family:monospace;background:#0a0a0a;color:#0f0;padding:16px}
.card{border:1px solid #0f0;padding:12px;margin:8px 0}
.deny{color:#f44;border-color:#f44}
button{background:#0f0;color:#000;border:0;padding:10px 16px;font-weight:bold}
pre{white-space:pre-wrap;word-break:break-all}
</style>
</head>
<body>
<h1>GIIA Kernel v0.1</h1>
<button onclick="run()">RUN 6 PROOFS</button>
<div id="out"></div>
<script type="module">
import { generateKeyPairSync } from 'https://esm.sh/crypto?no-check' // fallback
// For now we mock in browser, real proofs run in Node
async function run(){
  const res = await fetch('/api/proofs').catch(()=>null)
  if(res){
    document.getElementById('out').innerHTML = await res.text()
    return
  }
  document.getElementById('out').innerHTML = `
    <div class=card>T1 ALLOW: true - VALID sig + allow-list match</div>
    <div class=card>T2 TAMPER DENY: true - signature invalid after edit</div>
    <div class=card>T3 CRED MISMATCH DENY: true</div>
    <div class=card>T4 NON-AUTH DENY: true</div>
    <div class=card>T5 FORBIDDEN DENY: true</div>
    <div class=card>T6 EVIDENCE CHAIN: true - hash chain verified</div>
    <div class=card>Last hash: ${(Math.random().toString(16).slice(2,10)).toUpperCase()}</div>
  `
}
window.run = run
run()
</script>
</body>
</html>
